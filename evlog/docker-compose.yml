version: "3.8"

services:

  web:
    build: .
    container_name: volvo_trips_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: volvo_trips
      DB_USER: volvo_user
      DB_PASS: volvo_password
    restart: always

  db:
    image: mariadb:10.11
    container_name: volvo_trips_db
    restart: always
    environment:
      MYSQL_DATABASE: volvo_trips
      MYSQL_USER: volvo_user
      MYSQL_PASSWORD: volvo_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: volvo_trips_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db

volumes:
  db_data: